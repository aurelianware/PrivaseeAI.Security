name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
assignees:
  - aurelianware

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request

        We'd love to hear your ideas for improving PrivaseeAI.Security!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: "As a [type of user], I want to [goal] so that [benefit]..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you solve this problem?
      placeholder: Describe your ideal feature implementation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternatives?
      placeholder: Other ways to achieve the same goal
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What type of feature is this?
      options:
        - Detection - New threat detection capability
        - Performance - Speed or efficiency improvement
        - Usability - CLI or UX enhancement
        - Integration - Connect with external tools/services
        - Documentation - Guides or examples
        - Testing - Test coverage or infrastructure
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      description: How important is this to you?
      options:
        - Critical - I need this to use the tool
        - High - Significantly improves my workflow
        - Medium - Nice to have
        - Low - Minor enhancement
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case Example
      description: Provide a concrete example of how this feature would be used
      placeholder: |
        Example scenario:
        1. User wants to...
        2. They would run...
        3. The system would...
        4. Result: ...
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be willing to help implement this?
      options:
        - label: I'd like to implement this feature myself
        - label: I can help with testing
        - label: I can provide additional requirements/specs
        - label: I can help with documentation

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information
      placeholder: Links to similar features, mockups, related discussions, etc.
    validations:
      required: false
