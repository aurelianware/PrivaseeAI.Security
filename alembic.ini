# Alembic Configuration for PrivaseeAI.Security Database Migrations

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Truncate slug to max 40 characters
truncate_slug_length = 40

# Revision numbering format
# Use 'down_revision' for sequential numbering (recommended)
# revision_environment = false

# Output encoding
output_encoding = utf-8

# Database URL - override with environment variable
sqlalchemy.url = postgresql+asyncpg://privasee:privasee@localhost:5432/privasee_security

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
